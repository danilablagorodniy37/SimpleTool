name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Все тесты, которые меняют реестр, работают в песочнице HKCU\Software\SimpleToolTest,
      # службы и задачи подменяются; окно проверяется только на чтение
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
