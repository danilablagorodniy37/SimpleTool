name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every test that changes the registry runs in the sandbox HKCU\Software\SimpleToolTest,
      # services and tasks are replaced with fakes; the window is only checked read-only
      - name: Tests
        run: python -m unittest discover -s tests -t . -v
